# Render Blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: distill-api
    runtime: go
    region: oregon
    plan: free
    buildCommand: go build -o distill-api .
    startCommand: ./distill-api api --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false  # Set manually in dashboard
      - key: DISTILL_API_KEYS
        sync: false  # Recommended: comma-separated API keys for auth
      - key: GO_VERSION
        value: 1.24.2
    healthCheckPath: /health
    autoDeploy: true
